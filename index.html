arning",color:"bg-[#0a1931]",features:["يتعلم من البيانات","لا قواعد يدوية","تنبؤ وتصنيف"]},{id:"dl",title:"التعلم العميق",definition:"أسلوب من التعلم الآلي يعتمد على شبكات عصبية متعددة الطبقات، يمتاز بتعلم أنماط معقدة ويحتاج بيانات كبيرة نسبياً.",example:"تحليل الصور والتعرف على الكلام",tag:"Deep Learning",color:"bg-[#ff9f1c]",features:["شبكات متعددة الطبقات","أنماط معقدة","يحتاج بيانات كبيرة"]},{id:"ann",title:"الشبكات العصبية",definition:"نموذج رياضي مستوحى ببساطة من ترابط العصبونات في الدماغ، مكونات بسيطة مترابطة في طبقات، أوزانها تتعدل أثناء التدريب.",example:"طبقة إدخال، طبقات مخفية، طبقة إخراج",tag:"ANN",color:"bg-[#1e3a5f]",features:["مستوحاة من الدماغ","طبقات مترابطة","أوزان تتعدل"]},{id:"gen",title:"الذكاء الاصطناعي التوليدي",definition:"أنظمة قادرة على إنشاء محتوى جديد بالكامل (نصوص، صور، صوت، برمجيات) اعتماداً على الأنماط المتعلمة، تعتمد غالباً على التعلم العميق.",example:"ChatGPT، أدوات توليد الصور من النصوص",tag:"Generative AI",color:"bg-[#ff7a00]",features:["يولد محتوى جديد","يعتمد على DL","نصوص وصور وصوت"]},{id:"hall",title:"الهلوسة",definition:"إنتاج محتوى يبدو معقولاً ومنسقاً جداً ظاهرياً لكنه غير صحيح واقعياً ومضلل.",example:"نموذج يخترع مرجع علمي وهمي بثقة عالية",tag:"Hallucination",color:"bg-[#ff9f1c]",features:["يبدو مقنع","غير صحيح","خطر في الواجبات"]}],"1-3":[{id:"rec",title:"نظام التوصية",definition:"نظام يتنبأ بتفضيلاتك من بيانات سلوكك السابق (مشاهدة، شراء، بحث) ويعرض توصيات مخصصة لك تلقائياً.",example:"يوتيوب يقترح فيديوهات مشابهة لما شاهدته، أمازون يقترح منتجات، سبوتيفاي يقترح أغاني.",features:["تحليل السلوك السابق","التنبؤ بالتفضيلات","ترشيح المحتوى"],tag:"Recommendation System",color:"bg-[#ff7a00]"},{id:"voice",title:"المساعد الصوتي",definition:"تقنية ذكاء اصطناعي تتعرف على الصوت البشري، وتفهم الأوامر اللغوية، وتنفذها بشكل فوري.",example:"سيري (Siri) ومساعد جوجل: اسأل عن الطقس فينفذ الأمر صوتياً.",features:["التعرف على الصوت","فهم النية","تنفيذ الأوامر"],tag:"Voice Assistant",color:"bg-[#0a1931]"},{id:"trans",title:"الترجمة الآلية",definition:"ترجمة النص تلقائياً من لغة إلى أخرى باستخدام نماذج مدربة على مليارات الجمل.",example:"Google Translate و DeepL يترجمان موقع كامل بضغطة واحدة.",features:["ترجمة فورية","فهم السياق","دعم لغات متعددة"],tag:"Machine Translation",color:"bg-[#ff9f1c]"},{id:"face",title:"التعرف على الوجه",definition:"الكشف عن وجوه الأشخاص في الصور والتعرف عليها تلقائياً ومطابقتها مع الهوية.",example:"فتح قفل الهاتف الذكي ببصمة الوجه.",features:["كشف الوجه","استخراج السمات","المطابقة"],tag:"Face Recognition",color:"bg-[#1e3a5f]"},{id:"med",title:"التشخيص بالصور",definition:"استخدام الذكاء الاصطناعي لتحليل صور الأشعة السينية والمقطعية والكشف المبكر عن الأمراض.",example:"نموذج يكتشف الالتهاب الرئوي من أشعة الصدر بدقة عالية.",features:["تحليل صور طبية","كشف الأنماط المرضية","دعم القرار الطبي"],tag:"Medical Imaging AI",color:"bg-[#ff7a00]"},{id:"maint",title:"الصيانة التنبؤية",definition:"استخدام بيانات الحساسات للتنبؤ بأعطال الآلات والمعدات قبل وقوعها فعلياً.",example:"مصنع يتنبأ بتلف محرك قبل 48 ساعة فيوقف الإنتاج للصيانة.",features:["تحليل بيانات الحساسات","تنبؤ بالأعطال","تقليل التوقف"],tag:"Predictive Maintenance",color:"bg-[#0a1931]"},{id:"blackbox",title:"مشكلة الصندوق الأسود",definition:"الحالة التي يكون فيها من غير الواضح للبشر كيف توصل نظام الذكاء الاصطناعي إلى حكمه أو قراره.",example:"نموذج يرفض قرضاً بنكياً دون توضيح الأسباب التي أدت للرفض.",features:["غياب التفسير","صعوبة التدقيق","تحدي المساءلة"],tag:"Black Box Problem",color:"bg-[#1a1a1a]"},{id:"hall2",title:"الهلوسة",definition:"توليد معلومات غير صحيحة أو غير مدعومة تبدو مقنعة جداً للوهلة الأولى.",example:"نموذج لغوي يخترع مرجع علمي وهمي بثقة عالية.",features:["معلومة مقنعة خاطئة","غياب مصدر","خطر التضليل"],tag:"Hallucination",color:"bg-[#ff9f1c]"}],"1-4":[{id:"bias",title:"التحيز الخوارزمي",definition:"انحراف أو نمط في مخرجات الذكاء الاصطناعي قد يؤدي لنتائج غير عادلة أو ضارة، ينشأ من البيانات أو تصميم النظام أو طريقة الاستخدام أو السياق الاجتماعي.",example:"نظام توظيف يفضل فئة معينة بسبب أنماط تاريخية متحيزة",tag:"Algorithmic Bias",color:"bg-[#ff7a00]",features:["من البيانات","من التصميم","نتائج غير عادلة"]},{id:"train",title:"بيانات التدريب",definition:"البيانات المستخدمة لتدريب النموذج. إذا كانت غير كافية أو لا تمثل الواقع أو تعكس تمييز تاريخي ينتقل التحيز للنظام.",example:"شح بيانات عن مجموعة عرقية يؤدي لضعف التعرف عليها",tag:"Training Data",color:"bg-[#0a1931]",features:["غير كافية","غير ممثلة","تعكس تمييز سابق"]},{id:"face2",title:"التعرف على الوجه",definition:"تقنية تتعرف على الأفراد من الصور، لكنها أكثر عرضة لإساءة التعرف على مجموعات معينة إذا كانت بياناتها متحيزة.",example:"كاميرات عامة تتعرف وتتبع التحركات باستمرار",tag:"Face Recognition",color:"bg-[#1e3a5f]",features:["كشف وتصنيف","تتبع مستمر","خطر خصوصية"]},{id:"privacy",title:"الخصوصية",definition:"قضايا تهدد خصوصية الأفراد: المراقبة المستمرة بالكاميرات، والجمع الجماعي لبيانات السلوك لبناء ملفات تعريفية دون إذن واضح.",example:"جمع سلوكك على الإنترنت وتحليله",tag:"Privacy",color:"bg-[#ff9f1c]",features:["مراقبة مستمرة","جمع جماعي","ملفات تعريفية"]},{id:"xai",title:"الذكاء الاصطناعي القابل للتفسير",definition:"مجموعة أساليب تتيح للبشر فهم وتفسير العوامل والمنطق الذي أسهم في وصول النظام لقرار معين، تفك شفرة الصندوق الأسود.",example:"شرح لماذا رُفض طلب توظيف",tag:"XAI",color:"bg-[#0a1931]",features:["فهم المنطق","فك الصندوق الأسود","اكتشاف الأخطاء"]},{id:"black",title:"الصندوق الأسود",definition:"حالة يكون فيها من غير الواضح كيف توصل النظام لحكمه، فيصعب تقييم العدالة أو اكتشاف الأخطاء أو معالجة التحيز.",example:"قرار مجهول السبب",tag:"Black Box",color:"bg-[#1a1a1a]",features:["آلية مجهولة","صعوبة التدقيق","يحتاج XAI"]},{id:"resp",title:"المسؤولية",definition:"تحديد أدوار وواجبات الأطراف المرتبطة بتطوير النظام وتشغيله واستخدامه (المطور، الجهة المشغلة، المستخدم). لا يوجد توزيع واحد ثابت.",example:"المطور يختار المتغيرات، الشركة تعتمد النظام",tag:"Responsibility",color:"bg-[#ff7a00]",features:["أدوار متعددة","تختلف بالسياق","ليست ثابتة"]},{id:"fair",title:"العدالة",definition:"مبدأ أخلاقي يضمن عدم التمييز ظلماً ضد أي شخص أو مجموعة في الأحكام والمخرجات.",example:"اختبار النظام عبر فئات مختلفة",tag:"Fairness",color:"bg-[#22c55e]",features:["عدم تمييز","فحص التمثيل","اختبار عبر الفئات"]},{id:"transp",title:"الشفافية",definition:"إتاحة معلومات واضحة ومفهومة عن آليات عمل النظام وكيفية اتخاذ القرارات وحدوده، وتتطلب XAI.",example:"الإفصاح عن عملية اتخاذ القرار بطريقة سهلة الفهم",tag:"Transparency",color:"bg-[#ff9f1c]",features:["إتاحة معلومات","توضيح القرار","تحتاج XAI"]},{id:"acc",title:"المساءلة",definition:"تحديد الجهات المسؤولة قانونياً وأخلاقياً عن النظام وقراراته وآثاره وإمكانية محاسبتها. ليست هي القدرة على شرح القرار.",example:"من يُحاسب عند خطأ تشخيصي؟",tag:"Accountability",color:"bg-[#ef4444]",features:["تحديد المسؤول","محاسبة قانونية","ليست شرح القرار"]}]},E0={"1-1":{ideaTitle:"الفكرة الأساسية",ideaText:"في كل مرحلة أضافت تكنولوجيا المعلومات جهازاً أو طريقة جديدة، وغيّرت معه طريقة تواصل المجتمع وعمله وتجارته وتعلّمه وسداده لمدفوعاته. الأجهزة أصبحت أصغر حجماً وأكثر ترابطاً.",sub:"قاعدة: كلما زاد أثر الخطأ أو خطورة القرار، زادت الحاجة للإشراف البشري. والطالب في مصر اليوم يدفع إفطاره إلكترونياً وينضم لدرس عبر الإنترنت - خدمات لم تكن متاحة قبل 30 عاماً.",mainQ:"كيف تطورت تكنولوجيا المعلومات عبر مراحلها الرئيسية، وكيف غيّرت كل مرحلة المجتمع؟",prep:"الطالب في مصر يستطيع اليوم قراءة رسائله على تطبيق تواصل، ودفع ثمن إفطاره إلكترونياً، والانضمام لدرس عبر الإنترنت، وشراء كتاب من متجر إلكتروني - خدمات لم تكن منتشرة قبل 30 عاماً.",goals:["شرح المراحل الرئيسية في تطور تكنولوجيا المعلومات وأثرها في المجتمع","ذكر أمثلة على التغيرات الاجتماعية والتقنيات الناشئة وخصائصها","تحليل أثر إحدى تقنيات المعلومات في فئات مختلفة وتبرير قرار مستند للأدلة"]},"1-2":{ideaTitle:"الفكرة الأساسية",ideaText:"الذكاء الاصطناعي هو مجال واسع، ويُعد التعلم الآلي والتعلم العميق والذكاء الاصطناعي التوليدي مفاهيم مترابطة ومتداخلة بوضوح داخله - فئات متداخلة من العام للخاص.",sub:"العلاقة: AI مظلة عامة > ML فرع داخلها > DL أسلوب داخل ML > GenAI مبني غالباً على DL. وهي علاقة تعليمية مبسطة وليست احتواء هندسي صارم مطلق.",mainQ:"ما هو الذكاء الاصطناعي، وكيف يرتبط التعلم الآلي والتعلم العميق والذكاء الاصطناعي التوليدي ببعضهم البعض؟",prep:"ثلاثة أمثلة يومية تعمل في الخلفية: التعرف على الكلام، التعرف على الصور، الترجمة الآلية.",goals:["تعريف الذكاء الاصطناعي والتمييز بين التعلم الآلي والتعلم العميق والذكاء الاصطناعي التوليدي","شرح العلاقة بين هذه المفاهيم بأمثلة من واقع الحياة","تقييم خطر الهلوسة وتحديد إجراء مناسب للتحقق من مخرجات GenAI"]},"1-3":{ideaTitle:"الفكرة الأساسية",ideaText:"الذكاء الاصطناعي بارع في إيجاد الأنماط في البيانات، لكن الحكم البشري لا يزال ضرورياً عندما يتعلق الأمر بالأخلاق والخصوصية والمسؤولية.",sub:"قاعدة ذهبية: كلما زاد أثر الخطأ أو خطورة القرار، زادت الحاجة للإشراف البشري.",mainQ:"أين يُستخدم الذكاء الاصطناعي في الحياة اليومية والصناعة، وما الذي يبرع فيه، وما الذي يتطلب الحذر؟",prep:"خدمات AI تعمل في الخلفية: توصية يوتيوب، مساعد صوتي، خرائط، ترجمة - تتنبأ بالتفضيلات من السلوك السابق.",goals:["إعطاء أمثلة على كيفية استخدام AI في الحياة اليومية ومختلف الصناعات","شرح ما يبرع فيه الذكاء الاصطناعي وما يتطلب الحذر عند استخدامه","تقييم استخدام AI في سياق محدد وتبرير الحاجة للإشراف البشري عند ارتفاع أثر الخطأ"]},"1-4":{ideaTitle:"الفكرة الأساسية",ideaText:"إذا كانت بيانات التدريب متحيزة، يمكن لنظام الذكاء الاصطناعي أن يكرر هذا التحيز في أحكامه؛ واستخدام الذكاء الاصطناعي بمسؤولية يعني التحقق من التحيز، والقدرة على شرح القرارات، ومعرفة من هو المسؤول.",sub:"المبادئ الأربعة: العدالة، الشفافية، حماية الخصوصية، المساءلة. وتنبيه: المساءلة ليست هي القدرة على شرح القرار - الشرح هو XAI.",mainQ:"ما القضايا الأخلاقية التي تنشأ مع انتشار الذكاء الاصطناعي، وما المبادئ التي ينبغي أن توجه كيفية استخدامنا له؟",prep:"يساعد AI اليوم في قرارات تؤثر في مستقبلك: فرز طلبات التوظيف، التعرف على الأفراد، تحليل بيانات شخصية - تثار أسئلة حول العدالة والشفافية والخصوصية.",goals:["شرح ماهية التحيز الخوارزمي ووصف أسبابه الرئيسية","ربط المبادئ الأساسية لأخلاقيات الذكاء الاصطناعي بمواقف محددة","تقييم موقف أخلاقي وتبرير قاعدة للاستخدام المسؤول وتحديد الأطراف ذات المسؤولية"]}},_0={"1-1":{mcq:[{id:1,q:"ما الترتيب الزمني الصحيح لمراحل تطور تكنولوجيا المعلومات؟",options:["ظهور الحاسب → ظهور الهواتف الذكية → تسويق الإنترنت → الحوسبة السحابية","بداية الحاسب → تسويق الإنترنت تجارياً → ظهور الهواتف الذكية → انتشار الحوسبة السحابية","تسويق الإنترنت → بداية الحاسب → الحوسبة السحابية → الهواتف الذكية","الهواتف الذكية → الإنترنت → الحاسب → السحابة"],correct:1,explain:"الترتيب المنهجي: الأربعينيات بداية الحاسب (ENIAC) ← التسعينيات الإنترنت التجاري ← العقد الأول هواتف ذكية ← العقد الثاني سحابية."},{id:2,q:"ما اسم الملاحظة التجريبية القائلة إن عدد الترانزستورات يتضاعف كل عامين تقريباً؟",options:["قانون نيوتن","قانون مور","قانون أوم","قانون الجاذبية"],correct:1,explain:"قانون مور هو ملاحظة تجريبية وليس قانوناً فيزيائياً ثابتاً، يصف اتجاه تاريخي لازدياد الترانزستورات."},{id:3,q:"ما المصطلح الذي يشير إلى بيع السلع والخدمات وشرائها عبر الإنترنت؟",options:["شبكات التواصل الاجتماعي","التجارة الإلكترونية","العمل عن بُعد","الدفع غير النقدي"],correct:1,explain:"التجارة الإلكترونية E-commerce مثل أمازون وإيباي - بيع وشراء كامل عبر الإنترنت."},{id:4,q:"ما المصطلح الذي يصف أداء العمل من المنزل عبر الإنترنت؟",options:["التعلم عبر الإنترنت","العمل عن بُعد","التجارة الإلكترونية","الحوسبة الطرفية"],correct:1,explain:"العمل عن بُعد Remote Work نمط مرن من المنزل أو أي موقع بعيد باستخدام الإنترنت."},{id:5,q:"الدفع بوسائل إلكترونية مثل البطاقات و QR دون نقد يسمى:",options:["التجارة الإلكترونية","الدفع غير النقدي","الحوسبة السحابية","الواقع المعزز"],correct:1,explain:"الدفع غير النقدي Cashless Payment: بطاقات، تطبيقات هاتف، QR."},{id:6,q:"تقنية تستخدم AI لقيادة مركبة بأقل تدخل بشري تسمى:",options:["الواقع الافتراضي","القيادة الذاتية","الحوسبة الكمومية","قانون مور"],correct:1,explain:"القيادة الذاتية تعتمد على كاميرات ومستشعرات ومعالجة فورية لتتخذ قرارات آمنة."},{id:7,q:"لماذا الحوسبة الطرفية ضرورية في السيارات ذاتية القيادة؟",options:["لأنها أرخص","لأن تأخير السحابة قد يسبب حوادث - تحتاج معالجة فورية محلياً","لأنها تغير لون السيارة","لأنها تحذف البيانات"],correct:1,explain:"نقل البيانات للسحابة يستغرق وقت استجابة، والتأخير الطفيف في السرعات العالية قد يؤدي لكوارث، لذا المعالجة محلياً فوراً تحمي الركاب."},{id:8,q:"الواقع المعزز AR مقابل الواقع الافتراضي VR:",options:["كلاهما نفس الشيء","AR يضيف معلومات رقمية فوق العالم الحقيقي، VR يعزل المستخدم في بيئة افتراضية كاملة","AR يحذف المعلومات، VR يضيفها","VR أسرع في المعالجة"],correct:1,explain:"AR: إضافة عناصر رقمية فوق مشهد حقيقي. VR: عزل كامل داخل بيئة رقمية مولدة بالحاسب."},{id:9,q:"في الحوسبة الكمومية، الفرق بين البت والكيوبت:",options:["لا فرق","البت 0 أو 1 فقط، الكيوبت يستفيد من التراكب لتمثيل مزيج 0 و1 معاً","الكيوبت أبطأ","البت يستخدم ميكانيكا الكم"],correct:1,explain:"البت الكلاسيكي حالة واحدة (0 أو 1)، الكيوبت يستفيد من التراكب الكمومي Superposition."},{id:10,q:"أي مما يلي لا يُعد من التقنيات الناشئة في المنهج؟",options:["البريد الإلكتروني","القيادة الذاتية","الواقع المعزز","الحوسبة الكمومية"],correct:0,explain:"البريد الإلكتروني تقنية قديمة، بينما الناشئة هي: القيادة الذاتية، AR، VR، الحوسبة الكمومية."},{id:11,q:"شبكات التواصل الاجتماعي SNS تتميز بأنها:",options:["خدمة لبيع السلع فقط","خدمة تتيح التواصل ونشر المعلومات بسرعة كبيرة","نظام دفع فقط","أسلوب عمل من المنزل"],correct:1,explain:"تعريف SNS: تتيح التواصل ونشر المعلومات ومشاركتها بسرعة كبيرة جداً - فعالة جداً في النشر."},{id:12,q:"من التحديات التي تواجه استمرار تصغير الدوائر المتكاملة:",options:["ازدياد تيارات التسرب والنفق الكمومي","قلة الكهرباء","عدم وجود إنترنت","زيادة حجم الشاشة"],correct:0,explain:"التحديات الفيزيائية: تيارات التسرب وتأثيرات كمومية مثل النفق الكمومي Quantum Tunneling."}],essay:[{id:13,q:"حلّل كيف غيّر انتشار الحوسبة السحابية طريقة استخدام تكنولوجيا المعلومات. [6 درجات] أشر إلى: البيانات الضخمة، والذكاء الاصطناعي، و IT كخدمة",model:"1- التحول إلى IT كخدمة (درجتان): لم يعد المستخدم بحاجة لامتلاك أجهزة ضخمة محلياً، بل تقدم الموارد كخدمات مرنة عبر الإنترنت. 2- تمكين البيانات الضخمة (درجتان): وفرت تخزين عملاق ومعالجة مرنة لتجميع وتحليل البيانات الضخمة. 3- دعم AI (درجتان): تدريب نماذج AI يحتاج قدرات معالجة فائقة وفرتها السحابة بكفاءة.",points:6},{id:14,q:"قرية ريفية اتصلت حديثاً بإنترنت عالي السرعة وأصبح الدفع غير النقدي متاحاً. توقع تغيرين وتحدياً واحداً مع التفسير.",model:"التغير الأول: التجارة الإلكترونية - المزارعون يبيعون منتجاتهم لأسواق أوسع دون وسيط. التغير الثاني: الدفع غير النقدي - تسديد فواتير وشراء بلمسة زر دون السفر للمدن. التحدي: الأمن الرقمي وتدريب السكان - خطر النصب وتسريب البيانات أو عدم امتلاك هواتف ذكية.",points:4},{id:15,q:"املأ الفراغات: ظهرت الحواسيب في الأربعينيات، ثم انتشرت (1) في السبعينيات، وأتيح (2) تجارياً في التسعينيات، وظهرت (3) في العقد الأول من الألفية.",model:"(1) الحواسب الشخصية PCs (2) الإنترنت (3) الهواتف الذكية. التقنية من العقد الثاني: الحوسبة السحابية تدعم تحليل البيانات الضخمة و AI.",points:3},{id:16,q:"نشاط فكر كمهندس: ادرس الدفع غير النقدي - اجمع بيانات 10 زملاء وحدد الفائدة والتحدي للعميل وصاحب المتجر وشخص بلا بطاقة.",model:"العميل: فائدة سرعة بلمسة واحدة، تحدي حاجة لهاتف مشحون وحساب بنكي. صاحب المتجر: فائدة تقليل أخطاء حسابية وتنظيم أرباح، تحدي تكلفة أجهزة QR وعمولة. بلا بطاقة: لا فائدة، تحدي استبعاد مالي تام. التوصية: تحول تدريجي مع الحفاظ على النقدي لكبار السن.",points:4}]},"1-2":{mcq:[{id:1,q:"ما المجال العام الذي يضم أنظمة تنفذ مهام تحاكي القدرات الذهنية البشرية؟",options:["الذكاء الاصطناعي","الفوتوشوب","الواي فاي","البلوتوث"],correct:0,explain:"AI هو المجال العام الذي يضم أنظمة تتعلم وتتنبأ وتتعرف وتولد محتوى وتدعم اتخاذ القرار."},{id:2,q:"التعلم الآلي هو:",options:["فرع من AI تتعلم فيه النماذج أنماطاً من البيانات للتنبؤ والتصنيف دون برمجة صريحة","لغة برمجة فقط","جهاز حاسوب","قاعدة بيانات"],correct:0,explain:"ML يتعلم ذاتياً من البيانات، عكس البرمجة التقليدية التي تعتمد قواعد مبرمجة يدوياً."},{id:3,q:"التعلم العميق يعتمد على:",options:["شبكات عصبية متعددة الطبقات ويحتاج بيانات كبيرة","بطارية كبيرة","شاشة كبيرة","إنترنت بطيء"],correct:0,explain:"DL أسلوب من ML يستخدم شبكات عصبية متعددة الطبقات لتعلم أنماط معقدة، يحتاج بيانات كبيرة."},{id:4,q:"الذكاء الاصطناعي التوليدي هو:",options:["أنظمة تنشئ محتوى جديد بالكامل (نصوص، صور، صوت) اعتماداً على الأنماط المتعلمة","نظام يحذف الملفات","نظام يطبع فقط","نظام يشحن الهاتف"],correct:0,explain:"GenAI يولد محتوى جديد، يعتمد غالباً على التعلم العميق - مثال ChatGPT وتوليد الصور."},{id:5,q:"ظاهرة الهلوسة في GenAI تعني:",options:["إنتاج محتوى يبدو معقولاً جداً لكنه غير صحيح واقعياً ومضلل","سماع أصوات حقيقية","تعطل الجهاز","بطء الإنترنت"],correct:0,explain:"الهلوسة: نص منسق ومقنع ظاهرياً لكنه غير صحيح - خطر في الواجبات المدرسية."},{id:6,q:"العلاقة الصحيحة بين المفاهيم:",options:["AI > DL > ML > GenAI","ML > AI > GenAI > DL","AI > ML > DL > GenAI","GenAI > DL > ML > AI"],correct:2,explain:"AI مظلة عامة > ML فرع داخلها > DL أسلوب داخل ML > GenAI مبني على DL - علاقة تعليمية مبسطة."},{id:7,q:"أي مما يلي لا يُعد مثالاً مناسباً على الذكاء الاصطناعي التوليدي؟",options:["ChatGPT","توليد الصور","مرشح الرسائل المزعجة","توليد الصوت"],correct:2,explain:"مرشح الرسائل المزعجة هو تصنيف كلاسيكي يتبع ML، لا يولد محتوى جديداً."},{id:8,q:"الشبكة العصبية الاصطناعية مستوحاة من:",options:["ترابط العصبونات في الدماغ البشري بشكل مبسط","محرك السيارة","البطارية","المروحة"],correct:0,explain:"نموذج رياضي مستوحى ببساطة من فكرة ترابط الخلايا في الدماغ، أوزانها تتعدل أثناء التدريب."},{id:9,q:"لماذا يواجه AI صعوبة مع الأشياء النادرة؟",options:["لأنها لا تتوفر له أمثلة كافية في بيانات التدريب لتعلم تمثيل دقيق","لأنها ثقيلة","لأنها باهظة","لأنها ملونة"],correct:0,explain:"DL يضبط الأوزان بناءً على تكرار الأنماط، والشيء النادر لا تتوفر أمثلة كافية لتعلم موثوق."},{id:10,q:"إذا أراد مزارع تدريب نظام للتمييز بين محاصيل سليمة ومصابة، ما البيانات المطلوبة؟",options:["صور سليمة فقط","صور مصابة فقط","مجموعتان: صور سليمة وصور مصابة ليستخلص الفروق","لا يحتاج بيانات"],correct:2,explain:"يحتاج مجموعتين ليتعلم الفروق البصرية والأنماط المميزة لكل حالة."},{id:11,q:"التعلم الآلي والتعلم العميق:",options:["نفس المعنى تماماً","التعلم العميق أسلوب يندرج داخل التعلم الآلي","مختلفان تماماً","لا علاقة"],correct:1,explain:"DL ليس منفصلاً بل تقنية متقدمة تندرج بالكامل ضمن ML."},{id:12,q:"ما الإجراء السليم عند استخدام GenAI في تقرير مدرسي؟",options:["نسخ الإجابة كما هي","التحقق من المخرجات ومراجعة مصادر موثوقة ومقارنتها","حذف التقرير","إغلاق الجهاز"],correct:1,explain:"يجب التحقق الدائم من الدقة ومراجعة مصادر حقيقية ومقارنتها بمصادر موثوقة قبل الاعتماد."}],essay:[{id:13,q:"حلّل العلاقة بين AI و ML و DL و GenAI مع مثال لكل. [6 درجات]",model:"AI (1.5): مظلة عامة تحاكي القدرات الذهنية - مثال الترجمة الآلية. ML (1.5): فرع داخل AI يتعلم الأنماط ذاتياً دون برمجة صريحة - مثال مرشح البريد المزعج. DL (1.5): أسلوب داخل ML يستخدم شبكات عصبية متعددة الطبقات - مثال تحليل الصور المعقدة. GenAI (1.5): أنظمة مبنية على DL تولد محتوى جديد - مثال ChatGPT. العلاقة فئات متداخلة مبسطة تعليمياً.",points:6},{id:14,q:"صنف: تصنيف رسائل مزعجة، التعرف على المشاة في القيادة الذاتية، توليد صور من نص، التوصية بمنتجات.",model:"تصنيف رسائل: أ. تعلم آلي (تصنيف بسيط). التعرف على المشاة: ب. تعلم عميق (معالجة صور لحظية معقدة تتطلب شبكات عميقة لضمان السلامة). توليد صور: جـ. توليدي (ينشئ جديد). التوصية: أ. تعلم آلي (تحليل سلوك سابق).",points:4},{id:15,q:"املأ الفراغات: المجال العام (1)، فرع يتعلم أنماطاً (2)، أسلوب بشبكات متعددة الطبقات (3)، أنظمة تنشئ محتوى جديداً (4)",model:"(1) الذكاء الاصطناعي (2) التعلم الآلي (3) التعلم العميق (4) الذكاء الاصطناعي التوليدي",points:4},{id:16,q:"فكر كمهندس حول الهلوسة: ابحث عن مثال موثق لهلوسة GenAI، وقيّم فائدة ومخاطرة استخدامه في تقرير مدرسي، واقترح قاعدة مدرسية.",model:"مثال: ChatGPT اخترع مراجع وهمية لمقال إخباري. فائدة: سرعة توليد مسودة. مخاطرة: معلومات خاطئة غير مدعومة تضلل التحصيل. قاعدة: يسمح باستخدام GenAI كمساعد مسودة فقط مع ذكر المصدر وإلزام التحقق من مصدرين موثوقين قبل التسليم.",points:4}]},"1-3":{mcq:[{id:1,q:"ما المصطلح للنظام الذي يتنبأ بالتفضيلات من السلوك السابق؟",options:["نظام التوصية","المساعد الصوتي","الترجمة الآلية","الصيانة التنبؤية"],correct:0,explain:"نظام التوصية يحلل السلوك السابق كما في يوتيوب وأمازون."},{id:2,q:"أي مما يلي مثال على المساعد الصوتي؟",options:["Siri ومساعد جوجل","DeepL","فتح الهاتف بالوجه","تحسين مسارات التوصيل"],correct:0,explain:"المساعد الصوتي يتعرف على الصوت ويفهم الأوامر."},{id:3,q:"الترجمة الآلية هي:",options:["ترجمة نص تلقائيا بلغات مختلفة","ترجمة يدوية بواسطة بشر","نظام توصية فيديو","كشف آفات زراعية"],correct:0,explain:"مثل Google Translate و DeepL."},{id:4,q:"التعرف على الوجه يستخدم في:",options:["فتح الهاتف الذكي تلقائيا","التنبؤ بالحصاد","تحسين مسارات التوصيل","اكتشاف الأدوية"],correct:0,explain:"يكتشف الوجه ويتعرف عليه."},{id:5,q:"في أي صناعة يستخدم التشخيص بالصور؟",options:["الرعاية الصحية","الخدمات اللوجستية","الزراعة","التعليم فقط"],correct:0,explain:"للكشف عن الأمراض من الأشعة السينية والمقطعية."},{id:6,q:"الصيانة التنبؤية تعني:",options:["استخدام البيانات للتنبؤ بأعطال الآلات قبل وقوعها","إصلاح الآلة بعد العطل فقط","شراء آلات جديدة دائما","تنظيف المصنع"],correct:0,explain:"توفر الوقت والتكلفة وتمنع التوقف المفاجئ."},{id:7,q:"أي مما يلي مما يبرع فيه AI؟",options:["إيجاد وتصنيف الأنماط في الصور والنصوص","اتخاذ أحكام أخلاقية نهائية وحده","تحمل المسؤولية القانونية","حماية الخصوصية تلقائيا"],correct:0,explain:"AI بارع في الأنماط والتعرف والتنبؤ."},{id:8,q:"ما الذي يتطلب الحذر عند استخدام AI؟",options:["القرارات ذات البعد الأخلاقي والخصوصية","إيجاد الأنماط البسيطة","المعالجة السريعة للبيانات","التعرف على الصوت"],correct:0,explain:"الأخلاق والخصوصية والقرارات عالية الأثر تحتاج إشراف بشري."},{id:9,q:"مشكلة الصندوق الأسود تعني:",options:["عدم وضوح كيفية وصول النظام لقراره","أن الجهاز لونه أسود","أن الشاشة مغلقة","أن البيانات محذوفة"],correct:0,explain:"Black Box = فقدان الوضوح حول آلية الحكم."},{id:10,q:"الهلوسة في AI هي:",options:["توليد معلومات خاطئة تبدو مقنعة","سماع أصوات حقيقية","تعطل الجهاز","بطء الإنترنت"],correct:0,explain:"معلومة غير صحيحة لكنها مقنعة ظاهريا."},{id:11,q:"في الزراعة، استخدام AI يفيد في:",options:["الكشف عن الآفات والتنبؤ بالحصاد","ترجمة الكتب فقط","فتح الهاتف","توصية فيديو"],correct:0,explain:"الكشف المبكر ينقذ المحصول."},{id:12,q:"في الخدمات اللوجستية، AI يستخدم لـ:",options:["تحسين مسارات التوصيل","التشخيص بالأشعة","الكشف عن الآفات","فحص جودة المنتج فقط"],correct:0,explain:"تحسين المسارات يوفر وقت ووقود."}],essay:[{id:13,q:"حلّل لماذا يناسب AI بعض المهام بينما يتطلب الحذر في مهام أخرى؟ [6 درجات]",model:"ما يبرع فيه (3 درجات): إيجاد وتصنيف الأنماط المعقدة، التعرف التلقائي على الصور والصوت والنص، الاستدلال الاحتمالي والتنبؤ. ما يتطلب الحذر (3 درجات): القرارات الأخلاقية لتجنب التحيز، الخصوصية والمعلومات الحساسة، القرارات عالية الأثر مثل التشخيص الطبي حيث يجب الإشراف البشري لتحديد المسؤولية.",points:6},{id:14,q:"مستشفى يفكر في استخدام التشخيص بالصور. لماذا يجب أن يؤكد التشخيص طبيب بشري؟",model:"لأن AI لا يضمن الصحة المطلقة وقد يخطئ أو يتحيز، وأثر الخطأ عالي جدا على حياة المريض، والطبيب هو المؤهل قانونيا وأخلاقيا لتحمل المسؤولية وضمان السلامة.",points:3},{id:15,q:"غالبا تستخدم خدمات AI بياناتك الشخصية. لماذا يثير هذا مخاوف خصوصية ومن يقرر كيفية استخدامها؟",model:"يثير مخاوف لأنه يجمع ويحلل السلوك اليومي باستمرار. المستخدم نفسه يجب أن يكون له الحق الكامل في تقرير كيفية استخدام بياناته وحمايتها.",points:3},{id:16,q:"في الزراعة اذكر ميزة ومصدر قلق لاستخدام AI مع السبب.",model:"الميزة: الكشف السريع عن الآفات يتيح التدخل المبكر ويقلل الخسائر. القلق: إذا كانت بيانات التدريب غير كافية أو متحيزة فقد يتنبأ خطأ فيتلف المحصول أو تهدر الموارد.",points:3},{id:17,q:"مكتبة مدرسية تريد نظام توصية كتب بناء على الاستعارات السابقة. كيف سيعمل وما الاحتياط؟",model:"آلية العمل: نظام توصية يحلل سجل الاستعارات ويكتشف الاهتمامات المشتركة ويرشح كتب مشابهة. الاحتياط: حماية خصوصية الطلاب وعدم استخدام سجل القراءة لأغراض غير مصرح بها وضمان جودة البيانات لتجنب التحيز.",points:4},{id:18,q:"اذكر ثلاثة أمثلة يومية استخدمتها هذا الأسبوع تعتقد أنها استخدمت AI وما البيانات التي احتاجتها وأيها الأكثر خطورة إذا أخطأ؟",model:"1- توصية يوتيوب: بيانات المشاهدة والوقت. 2- مساعد صوتي: بصمة الصوت والأوامر. 3- خرائط التوصيل: الموقع والازدحام. الأكثر خطورة هو خرائط التوصيل أو التشخيص الطبي لأن خطأه يؤثر على السلامة.",points:4},{id:19,q:"اختر صناعة (صحة، تصنيع، لوجستيات) وابحث عن مثال حقيقي: فائدة واحدة واحتياط واحد وهل نعتمد على النظام وحده أم بمراجعة بشرية؟ مع سببان.",model:"مثال: الرعاية الصحية - كشف سرطان الجلد بالصور. الفائدة: تشخيص مبكر سريع. الاحتياط: تحيز البيانات وعدم وضوح القرار (صندوق أسود). القرار: يجب مراجعة بشرية. السبب 1: أثر الخطأ عالي على حياة المريض. السبب 2: المسؤولية القانونية والأخلاقية تقع على الطبيب.",points:4},{id:20,q:"اقترح قاعدة واحدة تجعل استخدام AI أكثر أمانا في مهمة حساسة (أخلاق / خصوصية / قرار نهائي).",model:"قاعدة: لا يتخذ AI قرار نهائي عالي الأثر وحده. مثال للخصوصية: يجب الحصول على موافقة واضحة من المستخدم قبل جمع بياناته وإتاحة خيار حذفها. هذا يضمن الشفافية والتحكم.",points:3}]},"1-4":{mcq:[{id:1,q:"ما المصطلح الذي يصف نمطاً في مخرجات AI قد يؤدي لنتائج غير عادلة أو ضارة؟",options:["التحيز الخوارزمي","الحوسبة الطرفية","التجارة الإلكترونية","قانون مور"],correct:0,explain:"التحيز الخوارزمي Algorithmic Bias: انحراف قد ينشأ من البيانات أو تصميم النظام أو طريقة الاستخدام."},{id:2,q:"من أسباب التحيز الخوارزمي:",options:["بيانات التدريب متحيزة أو غير كافية","سرعة المعالجة بطيئة","حجم الشاشة صغير","لون الجهاز"],correct:0,explain:"السبب الرئيسي: بيانات غير كافية عن فئة، أو بيانات تاريخية تعكس تمييز سابق، أو سوء اختيار متغيرات."},{id:3,q:"ما التقنية التي تتيح للبشر فهم سبب اتخاذ AI حكماً معيناً؟",options:["الذكاء الاصطناعي القابل للتفسير XAI","الواقع الافتراضي","الحوسبة الكمومية","التجارة الإلكترونية"],correct:0,explain:"XAI تفك شفرة الصندوق الأسود وتتيح فهم العوامل المؤثرة في المخرجات."},{id:4,q:"أي مبدأ يقتضي عدم التمييز ظلماً ضد أي شخص أو مجموعة؟",options:["العدالة","السرعة","التكلفة","الحجم"],correct:0,explain:"العدالة Fairness: تضمن عدم التمييز في الأحكام والمخرجات."},{id:5,q:"أي مبدأ يقتضي التعامل المناسب مع المعلومات الشخصية؟",options:["حماية الخصوصية","الشفافية","المساءلة","العدالة"],correct:0,explain:"حماية الخصوصية Privacy Protection: التعامل الآمن مع البيانات الحساسة وحمايتها من التسريب."},{id:6,q:"المساءلة تعني:",options:["تحديد الجهات المسؤولة عن نتائج AI وإمكانية محاسبتها قانونياً وأخلاقياً","شرح القرار فقط","حذف البيانات","زيادة السرعة"],correct:0,explain:"تنبيه هام: المساءلة ليست هي القدرة على شرح القرار - الشرح هو XAI، المساءلة هي تحديد من يُحاسب."},{id:7,q:"أي مما يلي يُعد قضية خصوصية مرتبطة بـ AI؟",options:["التعرف على الأفراد وتتبعهم عبر التعرف على الوجه وجمع بيانات السلوك","تحسن سرعة الحوسبة","إنشاء أعمال إبداعية فقط","زيادة حجم الشاشة"],correct:0,explain:"المراقبة المستمرة عبر كاميرات عامة، والجمع الجماعي لبيانات السلوك لبناء ملفات تعريفية دون إذن."},{id:8,q:"إذا لم يستطع أحد شرح سبب رفض AI لطلب توظيف، أي مبدأ مفقود؟",options:["الشفافية و XAI","السرعة","التكلفة","الحجم"],correct:0,explain:"غياب الشفافية: يحرم المتقدم من معرفة أسباب الرفض للتظلم، وقد يخفي تحيز ضد الجنس أو المنطقة - يحتاج XAI."},{id:9,q:"التحيز الخوارزمي قد ينشأ من:",options:["البيانات، طريقة تصميم النظام، طريقة الاستخدام، السياق الاجتماعي","لون الجهاز فقط","حجم البطارية فقط","نوع الشاحن فقط"],correct:0,explain:"مصادر متعددة: البيانات، التصميم، الاستخدام، السياق البشري والاجتماعي المحيط."},{id:10,q:"المتغير البديل Proxy Variable الخطير مثل استخدام المنطقة السكنية كبديل للعرق يؤدي لـ:",options:["تحيز غير مباشر ضد سمة محمية قانونياً","زيادة السرعة","تقليل التكلفة","تحسين البطارية"],correct:0,explain:"استخدام متغير بديل يمثل بشكل غير مباشر سمة محمية (المنطقة كبديل للعرق) يتسلل التحيز من خلاله."},{id:11,q:"عندما تكون آلية عمل النظام مجهولة (صندوق أسود) فإنه يصعب:",options:["تقييم عدالة النتائج واكتشاف الأخطاء ومعالجة التحيز","تشغيل الجهاز","شحن البطارية","فتح الشاشة"],correct:0,explain:"الصندوق الأسود Black Box: يصعب فحص المخرجات للتأكد من خلوها من التحيز، لذلك يساهم XAI في جعله موثوقاً."},{id:12,q:"في سيناريو كاميرات التعرف على الوجه عند بوابة مدرسة لتسجيل الحضور، المسؤولية عند الخطأ:",options:["تتشارك: المدرسة مسؤولة إدارياً بمراجعة الكشوف يدوياً، الشركة مسؤولة فنياً بتحديث الخوارزمية","لا أحد مسؤول","الطالب فقط","الإنترنت فقط"],correct:0,explain:"تتحمل المدرسة المسؤولية الإدارية والتشغيلية، والشركة المصنعة المسؤولية الفنية عن الدقة والتحديث."}],essay:[{id:13,q:"حلّل كيف يمكن أن ينشأ التحيز الخوارزمي وكيف يمكن تقليله. [6 درجات] أشر إلى سبب التحيز وعدالة وشفافية",model:"أسباب (3 درجات): بيانات تدريب غير كافية عن فئة، أو لا تمثل الواقع، أو تكرر انحيازات تاريخية، أو عيوب في بناء النظام مثل سوء اختيار المتغيرات. التقليل (3 درجات): العدالة تفحص تمثيل البيانات وتختبر المخرجات عبر فئات المجتمع لضمان عدم التمييز. الشفافية تفرض XAI لشرح المخرجات بوضوح لاكتشاف الأخطاء والتحيزات بدلاً من بقاء صندوق أسود.",points:6},{id:14,q:"املأ الفراغات: قد يظهر (1) عندما تؤدي البيانات أو التصميم لنتائج غير عادلة. لمعالجة الصندوق الأسود تُطور أساليب (2). وعند قرار خاطئ تُطرح مسألة (3).",model:"(1) التحيز الخوارزمي (2) الذكاء الاصطناعي القابل للتفسير XAI (3) المسؤولية - لا يوجد معيار واحد يوزعها، تختلف أدوار المطور والجهة المشغلة والمستخدم.",points:3},{id:15,q:"طابق: 1- عدم التمييز ظلماً 2- إتاحة معلومات واضحة عن النظام 3- التعامل مع البيانات الشخصية بشكل مناسب 4- تحديد المسؤولين ومحاسبتهم",model:"1- العدالة، 2- الشفافية، 3- حماية الخصوصية، 4- المساءلة. تنبيه: المساءلة ليست شرح القرار، الشرح هو XAI.",points:4},{id:16,q:"سيناريو: مدرسة تستخدم كاميرات تعرف وجه لتسجيل الحضور. اذكر فائدة، ومصدر قلق خصوصية، ومن المسؤول عند خطأ؟",model:"فائدة: تسجيل حضور سريع تلقائي يمنع ضياع وقت الحصص. قلق خصوصية: مراقبة لحظية مستمرة وتتبع وتخزين صور حيوية حساسة قد تُخترق. المسؤولية: مشتركة - المدرسة إدارياً تراجع الكشوف يدوياً قبل إنذار أولياء الأمور، الشركة فنياً تحدث الخوارزمية وترفع الدقة.",points:4},{id:17,q:"فكر كمهندس: ابحث عن حالة حقيقية لنظام توظيف AI متحيز، حلل أسباب التحيز، وزع المسؤولية، واقترح قاعدة تنظيمية.",model:"مثال: نظام أمازون استبعد النساء لأنه تعلم من سير ذاتية تاريخية متحيزة للذكور. الأسباب: بيانات تاريخية متحيزة + متغير بديل (كلمات مرتبطة بالجنس). المسؤولية: المطور اختار المتغيرات، الشركة اعتمدت دون فحص، المشغل أدار المدخلات. قاعدة: فحص تمثيل البيانات وتنوعها واختبار دوري عبر الفئات للتأكد من العدالة قبل التشغيل.",points:4}]}};function C0(){let[e,n]=Mn.useState("1-3"),[t,r]=Mn.useState(null),[l,o]=Mn.useState({}),[u,i]=Mn.useState(!1),[a,m]=Mn.useState({}),[g,w]=Mn.useState({}),v=k0[e]||[],E=v.find((s)=>s.id===t)||null,k=E0[e],_=_0[e],O=l[e]||{},p=_.mcq.reduce((s,y)=>s+(O[y.id]===y.correct?1:0),0),f=(s,y)
